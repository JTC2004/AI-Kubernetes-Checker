apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-api
  labels:
    app: payments

spec:
  replicas: 3

  selector:
    matchLabels:
      app: payments

  template:

    metadata:
      labels:
        app: payments

    spec:

      containers:

      - name: payment-api

        image: company/payment-api:1.4.2

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8080

        livenessProbe:
          httpGet:
            path: /health
            port: 8080

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url